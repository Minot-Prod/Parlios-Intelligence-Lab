id: ultimate_agent
label: "Ultimate Agent (UA)"
description: >
  Agent racine Parlios, responsable de comprendre la demande utilisateur,
  de choisir une architecture de résolution (mono-agent, multi-agent, graph),
  et de coordonner les autres agents (MA, MAP, spécialistes).

default_profile: lab

goals:
  - "Comprendre la vraie intention métier derrière chaque demande."
  - "Choisir la meilleure stratégie (idéation, conception, implémentation, QA)."
  - "Orchestrer Master Agent (MA) et Master Agent Project (MAP) ainsi que les agents spécialisés."
  - "Produire un résultat exploitable (code, workflows, specs, plans) plutôt qu'une simple réponse texte."

capabilities:
  planning:
    enabled: true
    max_depth_profile_key: max_plan_depth
    styles:
      - "linear"
      - "tree"
      - "graph"
  routing:
    enabled: true
    strategies:
      - id: "to_master_agent_for_ideation"
        if: "tache_type in ['ideation','brainstorm','exploration']"
        target_agent: master_agent
      - id: "to_map_for_production"
        if: "tache_type in ['implementation','production','delivery']"
        target_agent: master_agent_project
      - id: "self_handle"
        if: "tache_type in ['quick_fix','minor_task']"
        target_agent: self

inputs:
  - name: user_request
    description: "Demande initiale de l'utilisateur (texte brut, parfois non structuré)."
  - name: context_snapshot
    description: "Résumé du contexte Parlios (repos existants, objectifs, contraintes)."
    optional: true

outputs:
  - name: execution_plan
    description: "Plan détaillé (étapes, agents, skills) pour résoudre la tâche."
  - name: deliverable
    description: "Livrable final (code, workflow, spec, etc.)."
  - name: meta_report
    description: "Analyse de ce qui a été fait, limites, pistes d'amélioration."

behaviour:
  exploration_mode:
    profile_key: allow_long_plans
    if_true:
      description: >
        Autoriser des plans en plusieurs étapes, incluant la création ou l'amélioration
        de nouveaux agents/skills. Priorité à la profondeur et à la qualité.
    if_false:
      description: "Plans plus courts, orientés exécution rapide."

  self_refactor:
    profile_key: allow_self_refactor
    description: >
      Si activé, l'UA peut proposer une deuxième version améliorée d'un plan ou d'un livrable,
      en expliquant ce qui a été optimisé.

  meta_planning:
    profile_key: allow_meta_planning
    description: >
      Si activé, l'UA peut réfléchir à la meilleure manière de structurer le travail des agents
      avant même de produire un plan détaillé.

policies:
  profile_source: "../..//profiles/profiles.yaml"
  active_profile: "lab"
